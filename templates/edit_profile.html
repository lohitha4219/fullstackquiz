<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card{
      background: #fff;
      padding: 24px 28px;
      border-radius: 16px;
      width: 360px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    h2{
      text-align: center;
      margin-bottom: 16px;
    }
    .avatar{
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    .avatar img{
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2575fc;
    }
    label{
      font-weight: 600;
      font-size: 14px;
    }
    textarea, input[type="file"]{
      width: 100%;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    textarea{
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #ccc;
      resize: none;
    }
    .btn{
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #2575fc;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover{ opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Edit Profile</h2>

    <div class="avatar">
      <img id="preview" src="{{ profile.image.url|default:'/static/img/default-avatar.png' }}" alt="Profile">
    </div>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label>Bio</label>
      <textarea name="bio" rows="3" placeholder="Write something about you...">{{ profile.bio }}</textarea>

      <label>Profile Image</label>
      <input type="file" name="image" accept="image/*" onchange="previewImage(event)">

      <button class="btn" type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    function previewImage(event){
      const img = document.getElementById("preview");
      img.src = URL.createObjectURL(event.target.files[0]);
    }
  </script>
  
</body>
</html>

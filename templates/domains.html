<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Choose Your Domain</title>
  <style>
    :root{
      --neon:#00ffff;
      --bg1:#020617;
      --bg2:#0b1220;
      --glass:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",sans-serif}
    body{
      min-height:100vh;display:grid;place-items:center;color:#e5e7eb;
      background:
        radial-gradient(700px 350px at 10% 10%, rgba(0,255,255,.18), transparent 60%),
        radial-gradient(700px 350px at 90% 90%, rgba(0,180,255,.15), transparent 60%),
        linear-gradient(180deg,var(--bg2),var(--bg1));
      overflow:hidden;
    }

    .wrap{
      width:min(980px,92vw);
      padding:28px 22px 30px;
      border-radius:22px;
      background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25);
      position:relative;
    }

    .wrap::before{
      content:""; position:absolute; inset:-1px; border-radius:22px; pointer-events:none;
      box-shadow:0 0 40px rgba(0,255,255,.25), 0 0 80px rgba(0,180,255,.15);
      opacity:.8;
    }

    h1{
      text-align:center;margin:6px 0 18px; letter-spacing:.5px;
      color:var(--neon); text-shadow:0 0 16px var(--neon);
    }
    p.sub{
      text-align:center;color:#9ca3af;margin-bottom:18px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap:16px;
      margin-top:10px;
    }

    .card{
      position:relative; padding:22px 16px; border-radius:18px;
      background:rgba(10,12,18,.75);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);
      cursor:pointer; text-align:center;
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      box-shadow: inset 0 0 0 rgba(0,0,0,0);
    }

    .card::after{
      content:""; position:absolute; inset:0; border-radius:18px; pointer-events:none;
      box-shadow:0 0 0 rgba(0,0,0,0);
      transition:box-shadow .2s ease;
    }

    .card:hover{
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(0,255,255,.7);
      box-shadow:
        0 12px 28px rgba(0,255,255,.35),
        0 8px 22px rgba(0,180,255,.25);
    }
    .card:hover::after{
      box-shadow:
        0 0 18px rgba(0,255,255,.8),
        0 0 36px rgba(0,180,255,.55);
    }

    .icon{
      width:56px;height:56px;margin:0 auto 10px;border-radius:50%;
      display:grid;place-items:center;font-size:26px;color:#020617;
      background:linear-gradient(135deg,#00ffff,#6cf0ff);
      box-shadow:0 0 16px rgba(0,255,255,.7), 0 0 36px rgba(0,180,255,.45);
    }

    .title{
      font-weight:800; letter-spacing:.3px; margin:6px 0 4px;
      text-shadow:0 0 10px rgba(0,255,255,.5);
    }
    .desc{ color:#9ca3af; font-size:12px; }

    .footer{
      margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
      color:#9ca3af; font-size:12px;
    }

    .pill{
      padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      box-shadow: inset 0 0 10px rgba(0,255,255,.15);
    }
    .top-bar{
    display:flex;
    justify-content:flex-end;
    padding:15px;
}
.profile-box {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 14px;
  background: rgba(0, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0,255,255,0.3);
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
  transition: 0.4s ease;
  z-index: 1000;
}

.profile-box:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px cyan, 0 0 60px rgba(0,255,255,0.5);
}

.profile-avatar img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid cyan;
  object-fit: cover;
}

.profile-info h4 {
  color: cyan;
  margin: 0;
  font-size: 14px;
}

.profile-info p {
  color: #aaa;
  font-size: 12px;
  margin: 2px 0;
}

.edit-btn {
  font-size: 11px;
  color: cyan;
  text-decoration: none;
  transition: 0.3s;
}

.edit-btn:hover {
  text-shadow: 0 0 10px cyan;
}
  </style>
</head>
<body>
  <div class="profile-box">
  <div class="profile-avatar">
    <img src="{{ request.user.profile.image.url|default:'/static/img/default-avatar.png' }}" alt="Profile">
  </div>
  <div class="profile-info">
    <h4>{{ request.user.username }}</h4>
    <p>{{ request.user.profile.bio|default:"Add your bio" }}</p>
    <a href="{% url 'edit_profile' %}" class="edit-btn">Edit Profile</a>
  </div>
</div>
  <div class="wrap">
    <h1>Choose Your Domain ✨</h1>
    <p class="sub">Pick a domain to start your glowing quiz journey</p>

    <div class="grid">
  <div class="card" onclick="go('c')">
    <div class="icon">C</div>
    <div class="title">C Language</div>
    <div class="desc">Basics to Advanced</div>
  </div>

  <div class="card" onclick="go('java')">
    <div class="icon">☕</div>
    <div class="title">Java</div>
    <div class="desc">OOP, Collections, JVM</div>
  </div>

  <div class="card" onclick="go('py')">
    <div class="icon">🐍</div>
    <div class="title">Python</div>
    <div class="desc">Core, Data, Web</div>
  </div>

  <div class="card" onclick="go('web')">
    <div class="icon">🌐</div>
    <div class="title">Web Technology</div>
    <div class="desc">HTML, CSS, JS</div>
    
  </div>
</div>

<script>
  function go(domain){
    window.location.href = "/quiz/" + domain + "/";
  }
</script>
<div style="text-align:center;margin-top:20px;">
  <a href="{% url 'dashboard' %}">
    <button style="
      padding:10px 25px;
      border:none;
      border-radius:12px;
      background:#ff8800;
      color:white;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 0 10px orange;
    ">
      🏠 Home
    </button>
  </a>
</div>
</body>
</html>

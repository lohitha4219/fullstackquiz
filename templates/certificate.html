<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@page {
    size: A4 landscape;
    margin: 0;
}

body {
    margin: 0;
    padding: 0;
}

.container {
    width: 100%;
    height: 100%;
    background: url("/static/images/certificate_bg.jpg") no-repeat center;
    background-size: cover;
    position: relative;
    font-family: Georgia, serif;
    color: white;
}

/* TEXT POSITIONS */
.title {
    position: absolute;
    top: 80px;
    width: 100%;
    text-align: center;
    font-size: 60px;
    letter-spacing: 3px;
}

.level {
    position: absolute;
    top: 160px;
    width: 100%;
    text-align: center;
    font-size: 28px;
}

.text {
    position: absolute;
    top: 230px;
    width: 100%;
    text-align: center;
    font-size: 20px;
}

.name {
    position: absolute;
    top: 290px;
    width: 100%;
    text-align: center;
    font-size: 50px;
    color: #d4af37;
    font-family: "Brush Script MT", cursive;
}

.complete {
    position: absolute;
    top: 360px;
    width: 100%;
    text-align: center;
    font-size: 22px;
}

.course {
    position: absolute;
    top: 410px;
    width: 100%;
    text-align: center;
    font-size: 30px;
    color: #9ecbff;
}

.date {
    position: absolute;
    bottom: 100px;
    width: 100%;
    text-align: center;
    font-size: 20px;
}
</style>

</head>

<body>

<div class="container">

<div class="title">{{ domain|upper }} QUIZ</div>

<div class="level">{{ level|upper }} Level</div>

<div class="text">This certifies that</div>

<div class="name">{{ user.username }}</div>

<div class="complete">has successfully completed</div>

<div class="course">{{ domain|title }} Quiz Completed</div>

<div class="date">Date: {{ today }}</div>

</div>

</body>
</html>
